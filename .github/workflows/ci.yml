name: Validación básica de Python
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxis del proyecto
        run: python -m compileall -q app.py security tests
      - name: Pruebas unitarias de autorización
        run: python -m unittest discover -s tests -v
