name: Validación básica de Python
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxis del proyecto
        run: python -m compileall -q app.py security services ui tests
      - name: Instalar dependencias de pruebas
        run: python -m pip install 'pydantic>=2.10,<3' 'google-genai>=1.50,<2'
      - name: Pruebas unitarias de autorización y extracción
        run: timeout --signal=INT --kill-after=10s 45s python -u -m unittest discover -s tests -v
